name: Audit

# npm-audit regression gate. Deliberately a SEPARATE workflow: ci.yml is
# reused by release.yml via workflow_call and must stay decoupled from
# newly published external advisories (a fresh advisory must not turn a
# tag release red with zero code change). Same split okf-staleness.yml
# already documents; pattern precedent: the agent-grounding/triologue
# audit.yml gates from the 2026-06/07 CVE sweeps.
#
# Threshold: HIGH and CRITICAL advisories fail the gate step; moderate
# and low are report-only (first step, never red). npm audit covers the
# full hoisted tree INCLUDING devDependencies, so a red run here can be
# a dev-tool advisory rather than a runtime regression - read the audit
# report before reaching for version bumps.
#
# agent-tasks is a workspace monorepo with ONE root lockfile, so a
# single root audit covers every workspace. npm audit reads
# package-lock.json directly; no npm ci, zero added install time.
#
# If a HIGH/CRITICAL has no upstream fix, resolution is an operator
# decision (documented override or allowlist), never a silent threshold
# bump in this file.
#
# Gate step outcomes (incident 2026-09-04: the registry's advisories/bulk
# endpoint stopped answering for hours; npm's own client applies no
# timeout to that call and just hangs). The gate step below has four
# distinct outcomes, never conflated. It captures `npm audit
# --audit-level=high --json` and hands the output to scripts/audit-gate.mjs
# (dependency-free, self-test in scripts/audit-gate.test.mjs), which decides:
#   - exit 0, CLEAN: the endpoint answered, no HIGH or CRITICAL advisory
#     remains after the allowlist below. An advisory covered by an
#     allowlist entry counts as clean; the entries used are printed.
#   - exit 1, FINDINGS: the endpoint answered and returned a HIGH or
#     CRITICAL advisory that no allowlist entry covers (listed per
#     package), or an allowlist entry's reviewBy date is before today
#     (UTC), even when the advisory is gone. A real report always wins
#     over outage-like text elsewhere in the log, so a real finding can
#     never be misread as an outage.
#   - exit 2, OUTAGE: no audit report, but an outage marker is present
#     (registry error text, a DNS/connection failure, or the local
#     timeout below firing). This is NOT an advisory finding; do
#     not silence it with `|| true`, the fix is to retry the job later
#     once the endpoint is back.
#   - exit 3, UNCLASSIFIED: npm audit failed but the output is neither a
#     report nor an outage marker (for example a missing lockfile, or a
#     wrong working-directory), or the allowlist file is unreadable or
#     malformed. Treated as a real failure, not silenced; read the log.
# The report step below is bounded the same way (a step timeout plus an
# internal `timeout`) so a hanging endpoint cannot eat the job's
# timeout-minutes budget before this gate step, which does the actual
# classification, ever gets to run.
#
# Allowlist (.github/audit-allowlist.json): the only way to except an
# advisory that has no upstream fix. Each entry is { id, reason, reviewBy }
# with an exact GHSA id (matched against the advisory url in npm's JSON,
# never by severity or package name) and a YYYY-MM-DD review date; the
# entry stops passing the gate the day after reviewBy, so a renewal needs
# a commit with a recorded reason. reviewBy may lie at most 90 days after
# today (UTC); a later date makes the allowlist malformed (exit 3, naming
# the file and the id), so no exception can be parked for long. A package
# counts as excepted only when every HIGH/CRITICAL advisory in its
# dependency chain is allowlisted.
# An entry that matches nothing in a tree only warns (the same file is
# used for every tree below).
# The gate script is vendored from depsight commit be8c7ea
# (scripts/audit-gate.mjs); keep the copies in sync. The gate step runs
# without a `shell:` key, so GitHub Actions executes it as `bash -e {0}`;
# the step sets pipefail itself and guards the npm call with set +e/-e.

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: npm audit (full report, non-blocking)
        # Bounded (step timeout plus an internal `timeout`) so a hanging
        # endpoint cannot consume the job's timeout-minutes budget
        # before the gate step below, which does the actual
        # classification, gets a chance to run; still non-blocking via
        # `|| true` either way.
        timeout-minutes: 2
        run: timeout 60s npm audit --no-fund || true
      - name: audit gate self-test
        # Dependency-free (node:test, no npm ci); runs the classifier
        # against fixtures captured from this repo's own lockfile(s)
        # before the gate step relies on it.
        run: node --test scripts/audit-gate.test.mjs
      - name: npm audit gate (high/critical fail)
        # Per-step bound so a hanging endpoint cannot eat the whole job's
        # timeout-minutes budget; kept well under it.
        timeout-minutes: 5
        env:
          AUDIT_GATE_SCRIPT: ${{ github.workspace }}/scripts/audit-gate.mjs
          AUDIT_ALLOWLIST: ${{ github.workspace }}/.github/audit-allowlist.json
        run: |
          set -o pipefail

          # Bound on the audit call itself: npm's implicit HTTP client
          # applies no timeout of its own to the advisories/bulk request
          # (observed: it hangs indefinitely against a black-holed
          # endpoint, with zero output). This local bound lets the gate
          # notice that case at all instead of running out the step budget.
          AUDIT_TIMEOUT_SECS=60

          OUT="$(mktemp)"
          ERR="$(mktemp)"
          trap 'rm -f "$OUT" "$ERR"' EXIT

          # With no `shell:` key GitHub Actions runs `run:` steps as
          # `bash -e {0}` (this step sets pipefail itself, above);
          # without this guard, `set -e` would kill the script right at
          # this command on any non-zero exit (findings, outage, or a
          # timeout alike), before the classification below ever runs.
          set +e
          timeout "${AUDIT_TIMEOUT_SECS}s" npm audit --audit-level=high --no-fund --json >"$OUT" 2>"$ERR"
          STATUS=$?
          set -e

          # Keep npm's own diagnostics in the log; the classifier reads them too.
          cat "$ERR" >&2

          # The classifier's exit code (0 CLEAN, 1 FINDINGS, 2 OUTAGE,
          # 3 UNCLASSIFIED) is the step's exit code: under `set -e` a
          # non-zero exit of the last command ends the step with that status.
          node "$AUDIT_GATE_SCRIPT" --allowlist "$AUDIT_ALLOWLIST" --status "$STATUS" --stdout "$OUT" --stderr "$ERR"
