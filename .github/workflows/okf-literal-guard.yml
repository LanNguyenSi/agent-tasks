name: OKF literal guard

# Blocking check for T-007 (agent-tasks tracker 3feb590f, batch45 D-018):
# guards docs/okf's quoted VALUE literals (semver, quoted string, JSON-shaped
# bracket/brace, key: value) against the source lines their nearby line
# citations point at (backend/tests/unit/docs-okf-literal-guard.test.ts;
# design in docs/okf/index.md's Maintenance section). Runs beside ci.yml,
# not inside it, because ci.yml's `paths-ignore` (`**.md`, `docs/**`) skips
# its backend job entirely on a docs-only PR -- the exact shape batch-43
# (PR #509) shipped a citation drift in -- so the guard would otherwise
# never run where it matters most.
#
# T-010 (agent-tasks tracker 5e95e4bd, D-006): required-status decision.
# A path-filtered check (the `on.pull_request.paths` this workflow used to
# carry) cannot be made a REQUIRED branch-protection check as-is: GitHub
# never reports a status for a PR whose diff does not match the filter, so
# a required check that never triggers blocks every such PR forever. Two
# options were weighed, both scoped to this one workflow file so neither
# needs a second workflow:
#
# - (a) Required, with a skip-shim (ADOPTED here): drop the `paths:`
#   filter so the workflow triggers on every PR and every push to master,
#   and let the job itself decide (the "Detect docs/okf-relevant changes"
#   step below) whether the guard actually needs to run. When nothing
#   relevant changed, the later steps are skipped via `if:` and the job
#   still reports success under its stable name ("docs/okf literal
#   guard") -- so branch protection can require that name without ever
#   blocking an unrelated PR. Who pays: every PR now spends a few seconds
#   on a checkout + one `git diff` even when nothing relevant changed
#   (cheap: no `npm ci`, no vitest run on that path); in exchange, the
#   guard is enforceable, not merely advisory, so a docs/okf drift like
#   batch-43's cannot be merged past a reviewer who does not re-run it by
#   hand.
# - (b) Advisory (rejected as the default, kept as the fallback): keep the
#   `paths:` filter as it originally shipped and leave this check off
#   branch protection's required list. Who pays: nothing extra on every
#   PR, but the guard is opt-in -- a reviewer who does not notice a green
#   check is missing (because the workflow never triggered) can still
#   merge a citation drift, which is the exact gap T-007/T-010 exist to
#   close. Falls back to this only if the skip-shim's own diff step is
#   found to misbehave (see the "Detect" step's comment for the one input
#   it treats conservatively).
#
# The branch-protection edit itself (adding "docs/okf literal guard" to
# the required-checks list) is an operator step, not made by this task;
# see the PR body/handoff for the exact change.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  literal-guard:
    name: docs/okf literal guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Skip-shim (D-006 T-010, option a): computes whether this push/PR
      # actually touches anything the guard cares about, so the later
      # steps can be skipped with success instead of the whole workflow
      # never triggering (see the header comment). Conservative on the
      # one case it cannot diff cleanly: a base/before SHA this checkout
      # does not have (e.g. a force-push rewriting history, or `before`
      # being the all-zero SHA on a branch's first push) is treated as
      # "relevant", i.e. it runs the guard rather than risk a false skip.
      - name: Detect docs/okf-relevant changes
        id: filter
        run: |
          set -eo pipefail
          PATTERN='^(docs/okf/|backend/tests/helpers/okf-literal-guard\.ts$|backend/tests/unit/docs-okf-literal-guard\.test\.ts$|backend/tests/fixtures/okf-literal-guard/|\.github/workflows/okf-literal-guard\.yml$)'
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            BASE_SHA="${PR_BASE_SHA}"
            HEAD_SHA="${PR_HEAD_SHA}"
          else
            BASE_SHA="${PUSH_BEFORE_SHA}"
            HEAD_SHA="${GITHUB_SHA}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}

      - uses: actions/setup-node@v5
        if: steps.filter.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.filter.outputs.relevant == 'true'
        run: npm ci --no-audit --no-fund

      - name: Run the guard test
        if: steps.filter.outputs.relevant == 'true'
        run: npx vitest run tests/unit/docs-okf-literal-guard.test.ts
        working-directory: backend
