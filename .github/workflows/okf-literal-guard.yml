name: OKF literal guard

# Blocking check for T-007 (agent-tasks tracker 3feb590f, batch45 D-018):
# guards docs/okf's quoted VALUE literals (semver, quoted string, JSON-shaped
# bracket/brace, key: value) against the source lines their nearby line
# citations point at (backend/tests/unit/docs-okf-literal-guard.test.ts;
# design in docs/okf/index.md's Maintenance section). Runs beside ci.yml,
# not inside it, because ci.yml's `paths-ignore` (`**.md`, `docs/**`) skips
# its backend job entirely on a docs-only PR -- the exact shape batch-43
# (PR #509) shipped a citation drift in -- so the guard would otherwise
# never run where it matters most.
#
# Required-status decision (agent-tasks tracker 5e95e4bd): this job carries
# no `paths:` filter and runs on every `pull_request` and every `push` to
# master under the stable name "docs/okf literal guard", so it is safe to
# add to branch protection's required-status list -- a required check that
# never triggers on some PRs would block them forever, which an
# always-running trigger cannot do. Who pays: one repo-root `npm ci` (all
# workspaces) plus a sub-second test run on every PR; and, because the
# guard checks the whole docs/okf bundle on every run, any PR that shifts a
# cited source line (a pure source edit with no docs change) turns this
# check red and, once it is required, cannot merge until the citation is
# re-verified and re-stamped. That is the guard working as designed: a
# path filter is exactly what would hide such drift. An earlier revision
# kept a `paths:` filter plus a skip-shim job that reconstructed "does this
# PR affect the guard" from a hand-maintained pattern over a git diff; it
# was removed after review found it silently skipping relevant PRs (the
# CHANGELOG entry for task 5e95e4bd carries the measured cases). The
# branch-protection edit itself (adding "docs/okf literal guard" to
# master's required-status list) is an operator step, not made by this
# task.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  literal-guard:
    name: docs/okf literal guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the guard test
        run: npx vitest run tests/unit/docs-okf-literal-guard
        working-directory: backend
