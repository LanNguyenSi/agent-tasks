services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent_tasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agent_tasks
    volumes:
      - agent_tasks_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_tasks -d agent_tasks"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Idle ~36M; cap protects the host from a runaway query plan or
    # vacuum spike. Postgres scales connection pool / shared buffers
    # off this so 512M is comfortable for our workload (single-tenant,
    # small dataset). Bump if pg_stat_activity ever shows pressure.
    mem_limit: 512m
    networks:
      - internal

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://agent_tasks:${POSTGRES_PASSWORD}@db:5432/agent_tasks
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"
    # One-shot prisma db push container; lives only for the duration
    # of the schema sync. 512M is far above what a single push uses,
    # leaving headroom for a future migrate-deploy that would need
    # more.
    mem_limit: 512m

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://agent_tasks:${POSTGRES_PASSWORD}@db:5432/agent_tasks
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: https://agent-tasks.opentriologue.ai
      CORS_ORIGINS: https://agent-tasks.opentriologue.ai
      # Number of trusted reverse-proxy hops in front of the backend. Prod runs
      # behind exactly one Traefik hop, so the rate limiter must read the real
      # client IP from the rightmost X-Forwarded-For entry. Without this it
      # falls back to Traefik's container socket address and buckets every
      # client together, turning the per-client auth limits into global caps.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # Optional: gates the identity-broker register endpoint. Empty by
      # default (back-compat accept-any); set in prod .env to restrict.
      ALLOWED_GITHUB_LOGINS: ${ALLOWED_GITHUB_LOGINS:-}
      # Disk location for human-uploaded task attachments (image + text). The
      # bytes live on the agent_tasks_uploads volume; the DB stores only
      # metadata.
      UPLOAD_DIR: /app/uploads
    volumes:
      - agent_tasks_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Idle ~92M, request-burst peak observed ~250M. 768M caps without
    # constraining normal traffic and prevents a runaway request
    # handler from eating the whole host on a memory-leak regression.
    mem_limit: 768m
    networks:
      - internal
      - traefik
    labels:
      traefik.enable: "true"
      traefik.http.routers.agent-tasks-api.rule: Host(`agent-tasks.opentriologue.ai`) && (PathPrefix(`/api`) || PathPrefix(`/docs`))
      traefik.http.routers.agent-tasks-api.entrypoints: websecure
      traefik.http.routers.agent-tasks-api.tls.certresolver: letsencrypt
      traefik.http.services.agent-tasks-api.loadbalancer.server.port: "3001"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: https://agent-tasks.opentriologue.ai
    environment:
      NODE_ENV: production
      API_URL: http://backend:3001
    depends_on:
      - backend
    # Probes the Next.js server itself. node:22-slim ships no curl/wget, but
    # node 22 has global fetch; the IPv4 literal needs no DNS lookup and is
    # independent of how next start binds. Without this the container had
    # Health=none, so the 2026-08-17 alive-but-broken class was invisible to
    # `docker ps` and to the deploy panel's post-deploy gate (which reads
    # `docker compose ps` health but treats "no healthcheck" as clean). The
    # incident's own crash-loop mode is caught by the gate's pre-existing
    # container-STATE check (compose ps shows state=restarting with an EMPTY
    # health field while restarting); the health verdict adds operator
    # visibility (docker ps / docker inspect) and the Traefik effect below.
    #
    # ROUTING COUPLING (verified locally against traefik v3.6, filter exists
    # in v2+v3 sources): Traefik's Docker provider only routes containers
    # whose health is "healthy" -- "starting" and "unhealthy" are filtered.
    # So this healthcheck is load-bearing for the public route: on every
    # (re)start the route appears with the FIRST successful probe (~5s
    # measured locally), and a genuinely broken frontend is de-routed to a
    # public 404 -- which the panel gate's route probe fails on, if the app's
    # liveUrl covers the frontend. Failure side is deliberately loose
    # (retries 3, timeout 5s) so only ~15-20s of consecutively failing
    # probes de-routes a serving container; a de-route self-heals with the
    # next successful probe.
    # Detection bounds measured locally (idle Mac; slower under VPS load):
    # healthy ~5-6s after start; connection-refused unhealthy ~21s; hung
    # server (accepts TCP, never responds) is the slowest mode at ~41s.
    # Both resolve OUTSIDE the panel's optimistic ~15s poll window -- that
    # window gap is deploy-panel task 29dba1ee, not something tighter timing
    # here can fix without risking load-induced de-routes. start_period 10s
    # is grace against slow-start flapping (probe cost: a ~54MB node process
    # per tick, 12x/min in a 1G cgroup -- accepted for fast route
    # appearance).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Next.js production server. Idle ~152M but the SSR path can spike
    # briefly under traffic; 1G keeps that headroom while still
    # capping a runaway worker. Combined with the other caps above the
    # whole stack tops out at ~2.8G under normal operation, leaving
    # ample room for the build process during deploy on a 7.7G host.
    mem_limit: 1g
    networks:
      - internal
      - traefik
    labels:
      traefik.enable: "true"
      traefik.http.routers.agent-tasks.rule: Host(`agent-tasks.opentriologue.ai`)
      traefik.http.routers.agent-tasks.entrypoints: websecure
      traefik.http.routers.agent-tasks.tls.certresolver: letsencrypt
      traefik.http.services.agent-tasks.loadbalancer.server.port: "3000"

volumes:
  agent_tasks_postgres:
  # Human-uploaded task attachments. NOT covered by the Postgres backups: add
  # this named volume to the VPS backup scope separately.
  agent_tasks_uploads:

networks:
  internal:
  traefik:
    external: true
